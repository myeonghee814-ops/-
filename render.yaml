# Render Blueprint for a quick free-tier deploy of the backend, so the
# Vercel-hosted frontend has a live API to call. See docs/DEPLOY.md for
# the full click-through walkthrough (deploy order, where each URL goes).
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo. Render
# reads this file automatically.
#
# This is intentionally separate from docker-compose.prod.yml (which is
# still the real production shape: Postgres, migrations, gunicorn workers,
# nginx-fronted frontend) -- this one trades all of that for "free tier,
# zero manual config beyond two env vars, good enough to click through
# the UI and try search/AI analysis."
services:
  - type: web
    name: blip-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.render
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_FORMAT
        value: json
      # Set this to your deployed Vercel URL once you have it (e.g.
      # https://blip-frontend.vercel.app) -- see docs/DEPLOY.md step 3.
      # Starts as the dev default so the Blueprint deploys successfully
      # even before the frontend exists yet.
      - key: CORS_ORIGINS
        value: http://localhost:5173
      # Auto-generated by Render; only used by the not-yet-wired-up auth
      # placeholders (core/security.py), but Settings requires *something*.
      - key: SECRET_KEY
        generateValue: true
      # Optional: without this, everything except AI analysis/comparison/
      # export works (search still does) -- see docs/DEPLOY.md.
      - key: OPENAI_API_KEY
        sync: false
