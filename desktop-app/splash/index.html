<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>BLIP</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #0f172a;
        color: #e2e8f0;
        font-family: -apple-system, "Segoe UI", sans-serif;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
      }
      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #334155;
        border-top-color: #e2e8f0;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .hint {
        font-size: 13px;
        color: #64748b;
        max-width: 320px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <!-- Shown while src-tauri/src/main.rs waits for the backend sidecar's
         health check; once it responds, Rust navigates this window to
         http://127.0.0.1:8000 (the real app) via window.location.replace. -->
    <div class="wrap">
      <div class="spinner"></div>
      <div id="status">Starting BLIP…</div>
      <div class="hint" id="hint" style="display: none">
        Still starting — first launch installs some one-time dependencies and
        can take a minute.
      </div>
    </div>
    <script>
      setTimeout(function () {
        document.getElementById("hint").style.display = "block"
      }, 8000)
    </script>
  </body>
</html>
