name: Deploy dashboard to GitHub Pages

on:
  push:
    branches:
      - claude/electrolyte-research-db-u16qp2
      - claude/pubmed-electrolyte-scraper-sw9c8i
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Pages site
        run: |
          mkdir -p _site
          cp electrolyte-dashboard-preview.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
