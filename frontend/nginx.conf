# Serves the built SPA and reverse-proxies /api/ to the backend service so
# the frontend can keep calling relative paths (VITE_API_BASE_URL/
# VITE_API_ROOT_URL default to /api/v1 and /api respectively -- see
# src/services/apiClient.ts) exactly as it does in dev against Vite's own
# proxy. Same-origin in both environments means no production CORS
# configuration is needed beyond what already exists for local dev.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache-bust automatically: Vite fingerprints built asset filenames, so
    # it's safe to cache them aggressively.
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: unknown paths (e.g. a hard refresh on /paper/123) serve
    # index.html so React Router can handle the route client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
